services:
  auto-apply:
    build: .
    container_name: auto-apply-dashboard
    ports:
      - "2020:2020"  # Port principal pour l'interface web
    volumes:
      - ./personas.json:/app/personas.json
      - ./cvs.json:/app/cvs.json
      - ./searches.json:/app/searches.json
      - ./cv_template.html:/app/cv_template.html
      - ./cover_letter_template.txt:/app/cover_letter_template.txt
      - ./templates:/app/templates
      - ./cvs:/app/cvs
      - ./photos:/app/photos
      - ./data:/app/data
      - ./src:/app/src
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    networks:
      - auto-apply-network

networks:
  auto-apply-network:
    driver: bridge

