services:
  auto-apply:
    build: .
    container_name: auto-apply-dashboard
    ports:
      - "2020:2020"  # Port principal pour l'interface web
    volumes:
      - ./config:/app/config
      - ./templates:/app/templates
      - ./static:/app/static
      - ./cvs:/app/cvs
      - ./photos:/app/photos
      - ./data:/app/data
      - ./src:/app/src
      - ./tests:/app/tests
      - ./scripts:/app/scripts
      # Monter personas.json depuis l'extérieur du projet (../../personas.json)
      - ../../personas.json:/app/config/personas.json:ro
    environment:
      - FLASK_ENV=production
      - PYTHONUNBUFFERED=1
      # Décommentez et ajustez le chemin si personas.json est ailleurs:
      # - PERSONAS_FILE=/chemin/vers/personas.json
    restart: unless-stopped
    networks:
      - auto-apply-network

networks:
  auto-apply-network:
    driver: bridge

