{% extends "base.html" %}

{% block title %}Recherches - Auto Apply{% endblock %}

{% block content %}
<div class="card">
    <div class="searches-header" style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; flex-wrap: wrap; gap: 10px;">
        <h2 style="margin: 0;">🔍 Gestion des Recherches</h2>
        <button class="btn btn-primary" onclick="showCreateSearchModal()">➕ Créer une recherche</button>
    </div>
    
    <div class="searches-filter-buttons" style="display: flex; flex-wrap: wrap; gap: 12px; margin-bottom: 25px; padding: 20px; background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%); border-radius: 12px; border: 2px solid var(--border-color);">
        <button class="btn" onclick="loadAllSearches()" style="
            background: linear-gradient(135deg, var(--text-title) 0%, #5b21b6 100%);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95em;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
            transition: all 0.3s ease;
            border: none;
        " onmouseenter="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 4px 12px rgba(102, 126, 234, 0.4)'" 
           onmouseleave="this.style.transform='translateY(0)'; this.style.boxShadow='0 2px 8px rgba(102, 126, 234, 0.3)'">
            📋 Toutes les recherches
        </button>
        <button class="btn" onclick="loadEnabledSearches()" style="
            background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95em;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
            transition: all 0.3s ease;
            border: none;
        " onmouseenter="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 4px 12px rgba(16, 185, 129, 0.4)'" 
           onmouseleave="this.style.transform='translateY(0)'; this.style.boxShadow='0 2px 8px rgba(16, 185, 129, 0.3)'">
            ✅ Recherches activées
        </button>
        <button class="btn" onclick="selectAllSearches()" style="
            background: linear-gradient(135deg, var(--info) 0%, #2563eb 100%);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95em;
            box-shadow: 0 2px 8px rgba(59, 130, 246, 0.3);
            transition: all 0.3s ease;
            border: none;
        " onmouseenter="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 4px 12px rgba(59, 130, 246, 0.4)'" 
           onmouseleave="this.style.transform='translateY(0)'; this.style.boxShadow='0 2px 8px rgba(59, 130, 246, 0.3)'">
            ✅ Sélectionner tout
        </button>
        <button class="btn" onclick="deselectAllSearches()" style="
            background: linear-gradient(135deg, #6b7280 0%, #4b5563 100%);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95em;
            box-shadow: 0 2px 8px rgba(107, 114, 128, 0.3);
            transition: all 0.3s ease;
            border: none;
        " onmouseenter="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 4px 12px rgba(107, 114, 128, 0.4)'" 
           onmouseleave="this.style.transform='translateY(0)'; this.style.boxShadow='0 2px 8px rgba(107, 114, 128, 0.3)'">
            ❌ Désélectionner tout
        </button>
        <button class="btn" onclick="toggleAllSearchesEnabled()" style="
            background: linear-gradient(135deg, var(--warning) 0%, #d97706 100%);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95em;
            box-shadow: 0 2px 8px rgba(245, 158, 11, 0.3);
            transition: all 0.3s ease;
            border: none;
        " onmouseenter="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 4px 12px rgba(245, 158, 11, 0.4)'" 
           onmouseleave="this.style.transform='translateY(0)'; this.style.boxShadow='0 2px 8px rgba(245, 158, 11, 0.3)'">
            🔄 Activer/Désactiver sélectionnées
        </button>
        <button class="btn btn-success" onclick="showRunMultipleModal()" style="
            background: linear-gradient(135deg, var(--success) 0%, #059669 100%);
            color: white;
            padding: 12px 20px;
            border-radius: 10px;
            font-weight: 600;
            font-size: 0.95em;
            box-shadow: 0 2px 8px rgba(16, 185, 129, 0.3);
            transition: all 0.3s ease;
            border: none;
        " onmouseenter="this.style.transform='translateY(-2px)'; this.style.boxShadow='0 4px 12px rgba(16, 185, 129, 0.4)'" 
           onmouseleave="this.style.transform='translateY(0)'; this.style.boxShadow='0 2px 8px rgba(16, 185, 129, 0.3)'">
            🚀 Lancer plusieurs recherches
        </button>
        <span id="selectedSearchesCount" style="
            color: var(--text-title);
            font-weight: 700;
            padding: 12px 20px;
            background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
            border-radius: 10px;
            border: 2px solid var(--text-title);
            margin-left: auto;
            font-size: 0.95em;
            box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);
        ">
            0 sélectionnée(s)
        </span>
    </div>
    
    <div id="searchesList" class="searches-list-container">
        <div class="searches-loading">
            <div class="loading-icon">⏳</div>
            <p>Chargement des recherches...</p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_style %}
<style>
    @keyframes pulse {
        0%, 100% { opacity: 1; }
        50% { opacity: 0.5; }
    }
    
    @keyframes slideIn {
        from {
            opacity: 0;
            transform: translateY(20px);
        }
        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
    
    @keyframes shimmer {
        0% { background-position: -1000px 0; }
        100% { background-position: 1000px 0; }
    }
    
    /* Container des recherches */
    .searches-list-container {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(500px, 1fr));
        gap: 24px;
        padding: 20px;
    }
    
    .searches-loading {
        text-align: center;
        padding: 60px 20px;
        color: var(--text-secondary);
        grid-column: 1 / -1;
    }
    
    .loading-icon {
        font-size: 3em;
        margin-bottom: 15px;
        animation: pulse 2s infinite;
    }
    
    .search-card-ultra-modern {
        animation: slideIn 0.5s ease-out;
    }
    
    .search-card-ultra-modern:hover {
        transform: translateY(-4px) !important;
    }
    
    .search-card-ultra-modern.selected {
        border-color: var(--text-title) !important;
        box-shadow: 0 8px 24px rgba(102, 126, 234, 0.25), 0 0 0 1px rgba(102, 126, 234, 0.1) !important;
    }
    
    /* Pagination moderne - Style cohérent avec l'interface */
    .pagination-container {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        padding: 25px;
        background: linear-gradient(135deg, rgba(102, 126, 234, 0.05) 0%, rgba(118, 75, 162, 0.05) 100%);
        border-radius: 12px;
        border: 2px solid var(--border-color);
        box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);
    }
    
    .pagination-wrapper {
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 12px;
        flex-wrap: wrap;
    }
    
    .pagination-btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 8px;
        padding: 12px 20px;
        border: none;
        border-radius: 10px;
        font-weight: 600;
        font-size: 0.95em;
        cursor: pointer;
        transition: all 0.3s ease;
        position: relative;
        overflow: hidden;
    }
    
    .pagination-btn::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, rgba(255, 255, 255, 0.3), transparent);
        transition: left 0.5s ease;
    }
    
    .pagination-btn:hover::before {
        left: 100%;
    }
    
    .pagination-btn:disabled {
        opacity: 0.5;
        cursor: not-allowed;
    }
    
    .pagination-btn-nav {
        min-width: 120px;
        background: linear-gradient(135deg, var(--text-title) 0%, #5b21b6 100%);
        color: white;
        box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
    }
    
    .pagination-btn-nav:hover:not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    
    .pagination-btn-nav:active:not(:disabled) {
        transform: translateY(0);
        box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
    }
    
    .pagination-icon {
        font-size: 1.1em;
        transition: transform 0.3s ease;
    }
    
    .pagination-btn-nav:hover:not(:disabled) .pagination-icon {
        transform: scale(1.15);
    }
    
    .pagination-text {
        font-weight: 600;
    }
    
    .pagination-numbers {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
    }
    
    .pagination-btn-number {
        min-width: 44px;
        height: 44px;
        padding: 0;
        border-radius: 10px;
        font-weight: 700;
        font-size: 1em;
        background: var(--bg-card);
        color: var(--text-primary);
        border: 2px solid var(--border-color);
        box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
    }
    
    .pagination-btn-number:hover:not(.active):not(:disabled) {
        transform: translateY(-2px);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.2);
        border-color: var(--text-title);
        background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
    }
    
    .pagination-btn-number.active {
        background: linear-gradient(135deg, var(--text-title) 0%, #5b21b6 100%);
        color: white;
        border: none;
        box-shadow: 0 2px 8px rgba(102, 126, 234, 0.3);
        transform: scale(1.05);
    }
    
    .pagination-btn-number.active:hover {
        transform: scale(1.05) translateY(-2px);
        box-shadow: 0 4px 12px rgba(102, 126, 234, 0.4);
    }
    
    .pagination-ellipsis {
        padding: 0 8px;
        color: var(--text-secondary);
        font-weight: 600;
        user-select: none;
        display: flex;
        align-items: center;
        height: 44px;
    }
    
    .pagination-info {
        display: flex;
        align-items: center;
        gap: 10px;
        padding: 12px 20px;
        background: linear-gradient(135deg, rgba(102, 126, 234, 0.1) 0%, rgba(118, 75, 162, 0.1) 100%);
        border-radius: 10px;
        border: 2px solid var(--text-title);
        box-shadow: 0 2px 8px rgba(102, 126, 234, 0.2);
    }
    
    .pagination-info-text {
        color: var(--text-primary);
        font-size: 0.95em;
        font-weight: 600;
    }
    
    .pagination-info-text strong {
        color: var(--text-title);
        font-weight: 700;
    }
    
    .pagination-info-count {
        color: var(--text-title);
        font-size: 0.95em;
        font-weight: 700;
    }
    
    /* Responsive */
    @media (max-width: 1200px) {
        .searches-list-container {
            grid-template-columns: repeat(auto-fill, minmax(400px, 1fr));
            gap: 20px;
        }
    }
    
    @media (max-width: 768px) {
        .searches-list-container {
            grid-template-columns: 1fr !important;
            gap: 16px !important;
            padding: 10px !important;
        }
        
        .searches-filter-buttons {
            flex-direction: column;
            align-items: stretch;
        }
        
        .searches-filter-buttons .btn {
            width: 100%;
            min-width: unset;
        }
        
        .searches-filter-buttons #selectedSearchesCount {
            margin-left: 0;
            text-align: center;
            margin-top: 10px;
        }
        
        .pagination-wrapper {
            gap: 8px;
        }
        
        .pagination-btn-nav {
            min-width: 100px;
            padding: 10px 16px;
            font-size: 0.9em;
        }
        
        .pagination-text {
            display: none;
        }
        
        .pagination-numbers {
            gap: 6px;
        }
        
        .pagination-btn-number {
            min-width: 40px;
            height: 40px;
            font-size: 0.9em;
        }
        
        .pagination-info {
            flex-direction: column;
            gap: 4px;
            text-align: center;
            padding: 10px 16px;
        }
        
        .pagination-info-count {
            font-size: 0.85em;
        }
    }
    
    @media (max-width: 480px) {
        .searches-list-container {
            padding: 5px;
            gap: 12px;
        }
        
        .pagination-container {
            padding: 15px;
        }
        
        .pagination-wrapper {
            gap: 6px;
        }
        
        .pagination-btn-nav {
            min-width: 80px;
            padding: 8px 12px;
        }
        
        .pagination-btn-number {
            min-width: 36px;
            height: 36px;
            font-size: 0.85em;
        }
        
        .pagination-ellipsis {
            padding: 0 4px;
        }
    }
</style>
{% endblock %}

{% block extra_js %}
<script src="/static/js/searches.js"></script>
{% endblock %}
