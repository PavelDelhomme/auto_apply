{% extends "base.html" %}

{% block title %}Recherches - Auto Apply{% endblock %}

{% block extra_css %}
<link rel="stylesheet" href="/static/css/searches.css">
{% endblock %}

{% block content %}
<div class="card">
    <div class="searches-header">
        <h2>🔍 Gestion des Recherches</h2>
        <button class="btn btn-primary" onclick="showCreateSearchModal()">➕ Créer une recherche</button>
    </div>
    
    <div class="searches-filter-container">
        <button class="filter-btn filter-btn-primary" onclick="loadAllSearches()">
            📋 Toutes les recherches
        </button>
        <button class="filter-btn filter-btn-success" onclick="loadEnabledSearches()">
            ✅ Recherches activées
        </button>
        <button class="filter-btn filter-btn-info" onclick="selectAllSearches()">
            ✅ Sélectionner tout
        </button>
        <button class="filter-btn filter-btn-gray" onclick="deselectAllSearches()">
            ❌ Désélectionner tout
        </button>
        <button class="filter-btn filter-btn-warning" onclick="toggleAllSearchesEnabled()">
            🔄 Activer/Désactiver sélectionnées
        </button>
        <button class="filter-btn filter-btn-success" onclick="showRunMultipleModal()">
            🚀 Lancer plusieurs recherches
        </button>
        <span id="selectedSearchesCount" class="selected-count">
            0 sélectionnée(s)
        </span>
    </div>
    
    <div id="searchesList" class="searches-list-container">
        <div class="searches-loading">
            <div class="loading-icon">⏳</div>
            <p>Chargement des recherches...</p>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script src="/static/js/searches.js"></script>
{% endblock %}
